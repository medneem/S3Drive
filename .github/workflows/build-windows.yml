name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g. 1.0.0; without v)'
        required: true
        type: string

env:
  BASE_VERSION: "1.0.0"
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '' }}

permissions:
  contents: read

jobs:
  windows-portable:
    name: Windows x64 portable ZIP
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.17"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Validate manual release context
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw "Releases must be requested from the main branch"
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -r requirements-admin-build.txt

      - name: Stamp application version
        shell: pwsh
        run: |
          python scripts/stamp_version.py "$env:BASE_VERSION" "$env:GITHUB_RUN_NUMBER" "$env:RELEASE_VERSION"
          python -c "from version import APP_VERSION; print(APP_VERSION)"

      - name: Three independent verification passes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m compileall -q rclone_integrity.py localization.py main.py auto_update.py update_helper.py profiles.py mounts.py background.py drive_labels.py windows_service.py service_admin.py service_ui.py single_instance.py dependencies.py startup.py version.py scripts tests
          if ($LASTEXITCODE -ne 0) { throw "Python syntax checks failed" }
          for ($pass = 1; $pass -le 3; $pass++) {
            Write-Host "=== S3Drive test verification $pass/3 ==="
            python -m unittest discover -s tests -v
            if ($LASTEXITCODE -ne 0) { throw "Verification pass $pass failed" }
          }

      - name: Build icon
        run: python scripts/build_icon.py

      - name: Build onefile EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name S3Drive --version-file windows_version_info.txt --icon assets/app.ico --add-data "assets/app.svg;assets" main.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed" }
          if (-not (Test-Path "dist/S3Drive.exe" -PathType Leaf)) { throw "Missing S3Drive.exe" }
          # Build the elevated helper without the PyInstaller bootloader. Keep
          # onefile distribution and the existing explicit UAC behavior.
          $numeric = (python -c "from scripts.stamp_version import _components; from version import APP_VERSION; print('.'.join(map(str, _components(APP_VERSION))))").Trim()
          if ($LASTEXITCODE -ne 0) { throw "Unable to read executable version" }
          python -m nuitka --onefile --msvc=latest --assume-yes-for-downloads --output-dir=dist --output-filename=S3DriveAdmin.exe --windows-console-mode=disable --windows-icon-from-ico=assets/app.ico --company-name=medneem --product-name=S3Drive --file-description="S3Drive - Windows service administration" "--file-version=$numeric" "--product-version=$numeric" service_admin.py
          if ($LASTEXITCODE -ne 0) { throw "Native S3DriveAdmin build failed" }
          if (-not (Test-Path "dist/S3DriveAdmin.exe" -PathType Leaf)) { throw "Missing S3DriveAdmin.exe" }
          # Probe the packed EXE itself; no elevation, service edits or secrets.
          & ".\\dist\\S3DriveAdmin.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw "S3DriveAdmin.exe --self-test failed" }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name S3DriveUpdater --version-file windows_updater_version_info.txt --icon assets/app.ico update_helper.py
          if ($LASTEXITCODE -ne 0) { throw "S3DriveUpdater build failed" }
          if (-not (Test-Path "dist/S3DriveUpdater.exe" -PathType Leaf)) { throw "Missing S3DriveUpdater.exe" }

      - name: Verify EXE metadata and record SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (python -c "from version import APP_VERSION; print(APP_VERSION)").Trim()
          $descriptions = @{
            "S3Drive.exe" = "S3Drive - Windows S3 drive manager"
            "S3DriveAdmin.exe" = "S3Drive - Windows service administration"
            "S3DriveUpdater.exe" = "S3Drive - application updater"
          }
          foreach ($name in $descriptions.Keys) {
            $binary = Join-Path "dist" $name
            $info = (Get-Item -LiteralPath $binary).VersionInfo
            $expectedProductVersion = if ($name -eq "S3DriveAdmin.exe") {
              (python -c "from scripts.stamp_version import _components; from version import APP_VERSION; print('.'.join(map(str, _components(APP_VERSION))))").Trim()
            } else { $version }
            if ($info.CompanyName -ne "medneem" -or $info.ProductName -ne "S3Drive" -or
                $info.ProductVersion -ne $expectedProductVersion -or $info.OriginalFilename -ne $name -or
                $info.FileDescription -ne $descriptions[$name]) {
              throw "Incorrect Windows VERSIONINFO for $name"
            }
            $sha256 = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "$name SHA256: $sha256"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "$name SHA256: $sha256"
          }

      - name: Download and verify bundled dependencies
        shell: pwsh
        run: ./scripts/download_dependencies.ps1

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (python -c "from version import APP_VERSION; print(APP_VERSION)").Trim()
          if ($LASTEXITCODE -ne 0) { throw "Unable to read stamped APP_VERSION" }
          $archive = "S3Drive-v$version-windows-x64.zip"
          $folder = "release/S3Drive"
          New-Item -ItemType Directory -Force $folder | Out-Null
          Copy-Item "dist/S3Drive.exe" $folder
          Copy-Item "dist/S3DriveAdmin.exe" $folder
          Copy-Item "dist/S3DriveUpdater.exe" $folder
          Copy-Item "tools/rclone.exe" $folder
          Copy-Item "tools/winfsp-2.2.26215.msi" $folder
          Copy-Item "README_SETUP.txt" $folder
          Copy-Item "third_party/RCLONE_LICENSE.txt" (Join-Path $folder "RCLONE_LICENSE.txt")
          Copy-Item "assets/app.png" (Join-Path $folder "app-icon.png")
          Copy-Item "LICENSE" $folder
          Copy-Item "THIRD_PARTY_NOTICES.md" $folder
          Set-Content -Path (Join-Path $folder "VERSION.txt") -Value $version -Encoding utf8
          $expected = @("S3Drive.exe", "S3DriveAdmin.exe", "S3DriveUpdater.exe", "rclone.exe", "winfsp-2.2.26215.msi", "README_SETUP.txt", "RCLONE_LICENSE.txt", "app-icon.png", "LICENSE", "THIRD_PARTY_NOTICES.md", "VERSION.txt")
          $files = @(Get-ChildItem -LiteralPath $folder -File)
          if (@(Get-ChildItem -LiteralPath $folder -Directory).Count -ne 0) { throw "Unexpected subfolders" }
          if ($files.Count -ne $expected.Count) { throw "Unexpected file count" }
          foreach ($file in $files) {
            if ($file.Name -notin $expected -or $file.Length -le 0) { throw "Invalid file: $($file.Name)" }
          }
          foreach ($name in $expected) {
            if (-not (Test-Path (Join-Path $folder $name) -PathType Leaf)) { throw "Missing $name" }
          }
          Compress-Archive -Path "$folder/*" -DestinationPath $archive -CompressionLevel Optimal -Force
          Add-Type -AssemblyName System.IO.Compression
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $archive).Path)
          try {
            if ($zip.Entries.Count -ne $expected.Count) { throw "Wrong ZIP item count" }
            foreach ($entry in $zip.Entries) {
              if ($entry.FullName -notin $expected -or $entry.Length -le 0) { throw "Unexpected ZIP entry $($entry.FullName)" }
            }
          } finally { $zip.Dispose() }

      - name: Upload portable archive
        uses: actions/upload-artifact@v7
        with:
          name: S3Drive-windows-x64-${{ github.run_id }}
          path: S3Drive-v*-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: windows-portable
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: S3Drive-windows-x64-${{ github.run_id }}
          path: release

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          zip="release/S3Drive-${tag}-windows-x64.zip"
          test -s "$zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists — refusing to overwrite it"
            exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Git tag $tag already exists — refusing to reuse it"
            exit 1
          fi
          notes="release/RELEASE_NOTES.md"
          python scripts/release_notes.py --version "$RELEASE_VERSION" --output "$notes"
          manifest="release/S3Drive-update.json"
          python scripts/release_manifest.py --version "$RELEASE_VERSION" --archive "$zip" --output "$manifest"
          gh release create "$tag" "$zip" "$manifest" \
            --target "$GITHUB_SHA" \
            --title "S3Drive $tag" \
            --notes-file "$notes" \
            --latest
