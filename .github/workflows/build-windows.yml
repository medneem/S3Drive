name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g. 1.0.0; without v)'
        required: true
        type: string

env:
  BASE_VERSION: "1.0.0"
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '' }}

permissions:
  contents: read

jobs:
  windows-portable:
    name: Windows x64 portable ZIP
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Validate manual release context
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw "Releases must be requested from the main branch"
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Stamp application version
        shell: pwsh
        run: |
          python scripts/stamp_version.py "$env:BASE_VERSION" "$env:GITHUB_RUN_NUMBER" "$env:RELEASE_VERSION"
          python -c "from version import APP_VERSION; print(APP_VERSION)"

      - name: Three independent verification passes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m compileall -q main.py profiles.py mounts.py background.py drive_labels.py windows_service.py service_admin.py service_ui.py single_instance.py dependencies.py startup.py version.py scripts tests
          if ($LASTEXITCODE -ne 0) { throw "Python syntax checks failed" }
          for ($pass = 1; $pass -le 3; $pass++) {
            Write-Host "=== S3Drive test verification $pass/3 ==="
            python -m unittest discover -s tests -v
            if ($LASTEXITCODE -ne 0) { throw "Verification pass $pass failed" }
          }

      - name: Build icon
        run: python scripts/build_icon.py

      - name: Build onefile EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name S3Drive --version-file windows_version_info.txt --icon assets/app.ico --add-data "assets/app.svg;assets" main.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed" }
          if (-not (Test-Path "dist/S3Drive.exe" -PathType Leaf)) { throw "Missing S3Drive.exe" }
          python -m PyInstaller --noconfirm --clean --onefile --console --name S3DriveAdmin service_admin.py
          if ($LASTEXITCODE -ne 0) { throw "S3DriveAdmin build failed" }
          if (-not (Test-Path "dist/S3DriveAdmin.exe" -PathType Leaf)) { throw "Missing S3DriveAdmin.exe" }

      - name: Download and verify bundled dependencies
        shell: pwsh
        run: ./scripts/download_dependencies.ps1

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (python -c "from version import APP_VERSION; print(APP_VERSION)").Trim()
          if ($LASTEXITCODE -ne 0) { throw "Unable to read stamped APP_VERSION" }
          $archive = "S3Drive-v$version-windows-x64.zip"
          $folder = "release/S3Drive"
          New-Item -ItemType Directory -Force $folder | Out-Null
          Copy-Item "dist/S3Drive.exe" $folder
          Copy-Item "dist/S3DriveAdmin.exe" $folder
          Copy-Item "tools/rclone.exe" $folder
          Copy-Item "tools/winfsp-2.2.26215.msi" $folder
          Copy-Item "README_SETUP.txt" $folder
          Copy-Item "third_party/RCLONE_LICENSE.txt" (Join-Path $folder "RCLONE_LICENSE.txt")
          Copy-Item "assets/app.png" (Join-Path $folder "app-icon.png")
          Copy-Item "LICENSE" $folder
          Copy-Item "THIRD_PARTY_NOTICES.md" $folder
          Set-Content -Path (Join-Path $folder "VERSION.txt") -Value $version -Encoding utf8
          $expected = @("S3Drive.exe", "S3DriveAdmin.exe", "rclone.exe", "winfsp-2.2.26215.msi", "README_SETUP.txt", "RCLONE_LICENSE.txt", "app-icon.png", "LICENSE", "THIRD_PARTY_NOTICES.md", "VERSION.txt")
          $files = @(Get-ChildItem -LiteralPath $folder -File)
          if (@(Get-ChildItem -LiteralPath $folder -Directory).Count -ne 0) { throw "Unexpected subfolders" }
          if ($files.Count -ne $expected.Count) { throw "Unexpected file count" }
          foreach ($file in $files) {
            if ($file.Name -notin $expected -or $file.Length -le 0) { throw "Invalid file: $($file.Name)" }
          }
          foreach ($name in $expected) {
            if (-not (Test-Path (Join-Path $folder $name) -PathType Leaf)) { throw "Missing $name" }
          }
          Compress-Archive -Path "$folder/*" -DestinationPath $archive -CompressionLevel Optimal -Force
          Add-Type -AssemblyName System.IO.Compression
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $archive).Path)
          try {
            if ($zip.Entries.Count -ne $expected.Count) { throw "Wrong ZIP item count" }
            foreach ($entry in $zip.Entries) {
              if ($entry.FullName -notin $expected -or $entry.Length -le 0) { throw "Unexpected ZIP entry $($entry.FullName)" }
            }
          } finally { $zip.Dispose() }

      - name: Upload portable archive
        uses: actions/upload-artifact@v7
        with:
          name: S3Drive-windows-x64-${{ github.run_id }}
          path: S3Drive-v*-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Build antivirus diagnostic onedir
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        run: |
          # The onefile bootloader extracts native modules to a temporary
          # _MEI folder. Keep a separate transparent layout for AV diagnosis.
          python -m PyInstaller --noconfirm --clean --onedir --noupx --windowed --name S3Drive --version-file windows_version_info.txt --icon assets/app.ico --add-data "assets/app.svg;assets" main.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller onedir build failed" }
          if (-not (Test-Path "dist/S3Drive/S3Drive.exe" -PathType Leaf)) { throw "Missing onedir S3Drive.exe" }
          if (-not (Test-Path "dist/S3Drive/_internal" -PathType Container)) { throw "Missing onedir dependencies" }

      - name: Package antivirus diagnostic archive
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (python -c "from version import APP_VERSION; print(APP_VERSION)").Trim()
          if ($LASTEXITCODE -ne 0) { throw "Unable to read stamped APP_VERSION" }
          $folder = "diagnostic/S3Drive"
          New-Item -ItemType Directory -Force $folder | Out-Null
          Copy-Item "dist/S3Drive/*" $folder -Recurse -Force
          # Preserve the traditional portable layout (config.json beside EXE).
          # Reuse the verified dependencies from the regular package, but not
          # its onefile S3Drive.exe.
          Get-ChildItem "release/S3Drive" -File |
            Where-Object { $_.Name -ne "S3Drive.exe" } |
            Copy-Item -Destination $folder -Force
          if (-not (Test-Path "$folder/S3DriveAdmin.exe" -PathType Leaf)) { throw "Missing admin helper" }
          if (-not (Test-Path "$folder/rclone.exe" -PathType Leaf)) { throw "Missing rclone" }
          if (-not (Test-Path "$folder/_internal" -PathType Container)) { throw "Missing runtime dependencies" }
          $archive = "S3Drive-v$version-windows-x64-onedir.zip"
          Compress-Archive -Path "$folder/*" -DestinationPath $archive -CompressionLevel Optimal -Force
          if (-not (Test-Path $archive -PathType Leaf)) { throw "Missing diagnostic archive" }
          Write-Host "Diagnostic EXE SHA256:"
          Get-FileHash -Path "$folder/S3Drive.exe" -Algorithm SHA256 | Format-List

      - name: Upload antivirus diagnostic archive
        if: github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: S3Drive-windows-x64-onedir-${{ github.run_id }}
          path: S3Drive-v*-windows-x64-onedir.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: windows-portable
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: S3Drive-windows-x64-${{ github.run_id }}
          path: release

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          zip="release/S3Drive-${tag}-windows-x64.zip"
          test -s "$zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists — refusing to overwrite it"
            exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Git tag $tag already exists — refusing to reuse it"
            exit 1
          fi
          notes="release/RELEASE_NOTES.md"
          python scripts/release_notes.py --version "$RELEASE_VERSION" --output "$notes"
          gh release create "$tag" "$zip" \
            --target "$GITHUB_SHA" \
            --title "S3Drive $tag" \
            --notes-file "$notes" \
            --latest
