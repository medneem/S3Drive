name: Request S3Drive v1.5.0 (one-shot)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/request-release-v1.5.0.yml'

permissions:
  actions: write
  contents: read

jobs:
  request_release:
    if: github.repository == 'medneem/S3Drive' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify version is not already published
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.5.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v1.5.0 already exists"
            exit 1
          fi
      - name: Dispatch existing release workflow for v1.5.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run build-windows.yml --repo "$GITHUB_REPOSITORY" --ref main -f release_version=1.5.0
