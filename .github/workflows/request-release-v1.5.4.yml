name: Request S3Drive v1.5.4 (one-shot)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/request-release-v1.5.4.yml'

permissions:
  actions: write
  contents: read

jobs:
  request_release:
    if: github.repository == 'medneem/S3Drive' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify release and tag do not exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.5.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v1.5.4 already exists"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.5.4" >/dev/null 2>&1; then
            echo "::error::Git tag v1.5.4 already exists"
            exit 1
          fi
      - name: Request official version-stamped Windows build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build-windows.yml --repo "$GITHUB_REPOSITORY" --ref main -f release_version=1.5.4
