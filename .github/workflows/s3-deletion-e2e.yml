name: S3 deletion E2E (Windows WinFsp)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s3-deletion-e2e.yml'
      - 'tests/integration/test_s3_delete_windows.py'
      - 'mounts.py'
      - 'windows_service.py'
      - 'tests/test_core.py'
      - 'tests/test_windows_service.py'
      - 'scripts/download_dependencies.ps1'
      - 'network_drive.py'
  pull_request:
    paths:
      - '.github/workflows/s3-deletion-e2e.yml'
      - 'tests/integration/test_s3_delete_windows.py'
      - 'mounts.py'
      - 'windows_service.py'
      - 'tests/test_core.py'
      - 'tests/test_windows_service.py'
      - 'scripts/download_dependencies.ps1'
      - 'network_drive.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deletion-e2e:
    name: Delete directories on real WinFsp mount + local S3
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install isolated S3 test backend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install "moto[server]==5.2.2" boto3 pywin32
          if ($LASTEXITCODE -ne 0) { throw "Moto S3 installation failed" }

      - name: Download exact production rclone and WinFsp (SHA256 verified)
        shell: pwsh
        run: ./scripts/download_dependencies.ps1

      - name: Install WinFsp driver for mount integration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msi = (Resolve-Path "tools/winfsp-2.2.26286.msi").Path
          $installerLog = Join-Path $env:RUNNER_TEMP "winfsp-install.log"
          $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            "/i", """$msi""", "/qn", "/norestart", "/L*v", """$installerLog"""
          )
          if ($process.ExitCode -ne 0) {
            Get-Content $installerLog -Tail 70
            throw "WinFsp installer exit code: $($process.ExitCode)"
          }

      # Test-only patched rclone; never published or copied into S3Drive ZIP.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          cache: false

      - name: Build pinned rclone with experimental WinFsp RMDIR notification
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git clone --depth 1 --branch v1.76.0 https://github.com/rclone/rclone.git rclone-source
          if ($LASTEXITCODE -ne 0) { throw "Failed to clone pinned rclone source" }
          $commit = (git -C rclone-source rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $commit -ne "e982ff36668f5130d94b4f70409babb3d964df42") {
            throw "Unexpected rclone v1.76.0 source commit: $commit"
          }
          python scripts/patch_rclone_notify_experiment.py rclone-source
          if ($LASTEXITCODE -ne 0) { throw "Failed to patch expected upstream rclone sources" }
          go -C rclone-source fmt ./cmd/cmount
          if ($LASTEXITCODE -ne 0) { throw "Go fmt failed" }
          go -C rclone-source build -tags cmount -trimpath -o ../tools/rclone.exe .
          if ($LASTEXITCODE -ne 0) { throw "Experimental rclone build failed" }
          & ./tools/rclone.exe version
          if ($LASTEXITCODE -ne 0) { throw "Experimental rclone failed to start" }
          Write-Host "Test-only patched rclone SHA256: $((Get-FileHash ./tools/rclone.exe -Algorithm SHA256).Hash)"

      # The integration suite also registers a disposable real Windows
      # rclone service and stops it through the authenticated control pipe.
      - name: Three real mount + S3 API deletion checks
        shell: pwsh
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          $ErrorActionPreference = "Continue"
          $failures = 0
          for ($pass = 1; $pass -le 3; $pass++) {
            Write-Host "=== S3 deletion end-to-end verification $pass/3 ==="
            python -m unittest discover -s tests/integration -p 'test_s3_delete_windows.py' -v
            if ($LASTEXITCODE -ne 0) {
              $failures++
              Write-Host "::error::S3 directory deletion verification failed in pass $pass"
            }
          }
          if ($failures -gt 0) {
            throw "$failures/3 S3 deletion verification runs failed. Check reappearing prefixes."
          }
